{% extends "base.html" %}

{% block title %}Sign In – SmartPark Gandhipuram{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-white py-3 text-center border-bottom">
                    <h4 class="fw-bold mb-0 text-dark"><i class="bi bi-box-arrow-in-right text-primary me-2"></i>Sign In</h4>
                    <small class="text-muted">Access your reservations and parking preferences</small>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address</label>
                            <input type="email" name="email" id="emailInput" class="form-control" required
                                   placeholder="name@example.com" value="{{ email or '' }}">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" name="password" id="passwordInput" class="form-control" required
                                   placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-semibold">
                            Sign In
                        </button>
                    </form>

                    <!-- Demo Credentials Helper -->
                    <div class="mt-4 p-3 bg-light rounded-3 border">
                        <small class="text-muted d-block fw-bold mb-2">QUICK FILL DEMO CREDENTIALS (3 ROLES)</small>
                        <div class="d-flex flex-column gap-2">
                            <div class="d-flex gap-2">
                                <button type="button" class="btn btn-sm btn-outline-primary flex-fill" onclick="fillCreds('user@smartpark.com', 'User@123')">
                                    <i class="bi bi-car-front me-1"></i> Driver
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-info flex-fill text-dark" onclick="fillCreds('staff.p1@smartpark.com', 'Staff@123')">
                                    <i class="bi bi-person-badge me-1"></i> Staff (P1)
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-warning flex-fill" onclick="fillCreds('admin@smartpark.com', 'Admin@123')">
                                    <i class="bi bi-shield-lock me-1"></i> Super Admin
                                </button>
                            </div>
                            <div class="btn-group btn-group-sm">
                                <button type="button" class="btn btn-light border text-muted" style="font-size: 0.72rem;" onclick="fillCreds('staff.p2@smartpark.com', 'Staff@123')">Staff P2</button>
                                <button type="button" class="btn btn-light border text-muted" style="font-size: 0.72rem;" onclick="fillCreds('staff.p3@smartpark.com', 'Staff@123')">Staff P3</button>
                                <button type="button" class="btn btn-light border text-muted" style="font-size: 0.72rem;" onclick="fillCreds('staff.p4@smartpark.com', 'Staff@123')">Staff P4</button>
                                <button type="button" class="btn btn-light border text-muted" style="font-size: 0.72rem;" onclick="fillCreds('staff.p5@smartpark.com', 'Staff@123')">Staff P5</button>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-4 small text-muted">
                        Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function fillCreds(email, password) {
    document.getElementById('emailInput').value = email;
    document.getElementById('passwordInput').value = password;
}
</script>
{% endblock %}
